# Drawer stowing: Wuji 2, right hand, wrist camera plus a third-person camera.
#   python -m dexport.collect --config configs/collect/wuji2_drawer.yaml
# All keys and defaults: dexport/collect/config.py.
hand_model: wuji2
hand:
  right: {enabled: true}
cameras:  # index N = /dev/videoN (v4l2-ctl --list-devices); 224x224 @ 30 fps
  - {key: right_rgb, index: 0}  # wrist fisheye
  - {key: left_rgb, index: 2}  # third-person camera, the drawer policy's second image key
trajectory:
  save_dir: data  # relative to the working directory
  tag: drawer
  save_pose_l: false
  save_quat_l: false
  save_pose_r: true
  save_quat_r: true
